# Local rehearsal only: no Caddy, public ports, customer credentials or production database.
services:
  caddy:
    profiles: [public-edge]
  production-app:
    profiles: [production]
  production-db:
    profiles: [production]
  production-db-tools:
    profiles: [production]
  preview-app:
    environment:
      APP_BASE_URL: http://127.0.0.1:${LOCAL_RC_PORT:-3120}
    ports:
      - "127.0.0.1:${LOCAL_RC_PORT:-3120}:3000"
