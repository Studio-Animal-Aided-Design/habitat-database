services:
  - type: web
    name: aad-habitat-preview
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix apps/web && npm ci --prefix packages/database && npm run build --prefix apps/web && mkdir -p apps/web/.next/standalone/apps/web/.next && cp -r apps/web/public apps/web/.next/standalone/apps/web/ && cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/web/**
        - packages/database/**
      ignoredPaths: []
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: APP_ENV
        value: preview
      - key: CATALOG_DATA_SOURCE
        value: mock
      - key: ALLOW_MOCK_CATALOG_IN_PREVIEW
        value: "true"
      - key: IMPORT_API_ENABLED
        value: "false"
      - key: PREVIEW_ACCESS_MODE
        value: shared-password
      - key: PREVIEW_ACCESS_PASSWORD_HASH
        sync: false
      - key: PREVIEW_ACCESS_SESSION_SECRET
        generateValue: true
      - key: PREVIEW_ACCESS_SESSION_DURATION_SECONDS
        value: "604800"
